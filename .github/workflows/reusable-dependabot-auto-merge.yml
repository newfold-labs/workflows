name: Reusable - Dependabot Auto-Merge
on:
  workflow_call:
    inputs:
      pr-number:
        description: Number of the Dependabot PR to merge.
        type: string
        required: true
      head-sha:
        description: Head commit SHA of the PR; used to gate on check-run results.
        type: string
        required: true
      merge-method:
        description: How to merge the PR. One of merge | squash | rebase.
        type: string
        default: merge

# Disable permissions for all available scopes by default.
# Any needed permissions should be configured individually for each job.
permissions: {}

jobs:
  # Approves the Dependabot PR and merges it once every other check run on the head
  # SHA has finished successfully. Caller is wired to `workflow_run` on the repo's
  # CI workflows, so this job fires once per CI workflow completion. Earlier firings
  # see in-progress checks and defer; the last firing sees everything green and
  # performs the merge. There is no native `--auto` arming here: the gate is this
  # job's own check-run aggregation, not branch protection.
  #
  # Job ID is intentionally specific so the gate step can identify and exclude
  # check runs produced by ANY invocation of this reusable workflow on the same SHA
  # (not just the currently-executing run). Otherwise a previously-failed auto-merge
  # check run would block all future firings.
  dependabot-auto-merge:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    timeout-minutes: 5
    steps:
      - name: Validate merge-method input
        env:
          MERGE_METHOD: ${{ inputs.merge-method }}
        run: |
          case "$MERGE_METHOD" in
            merge|squash|rebase) ;;
            *) echo "::error::invalid merge-method '$MERGE_METHOD' (expected merge|squash|rebase)"; exit 1 ;;
          esac

      - name: Verify PR is open and authored by Dependabot
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr-number }}
        run: |
          read -r state author <<<"$(gh api "repos/${REPO}/pulls/${PR_NUMBER}" --jq '"\(.state) \(.user.login)"')"
          if [[ "$state" != "open" ]]; then
            echo "::notice::PR #${PR_NUMBER} is ${state}; nothing to do"
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$author" != "dependabot[bot]" ]]; then
            echo "::notice::PR #${PR_NUMBER} authored by '${author}', not dependabot[bot]"
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "proceed=true" >> "$GITHUB_OUTPUT"

      # Walk every check run on the head SHA, excluding ones from any auto-merge
      # invocation. Two layers of exclusion:
      #   (a) details_url contains the current run-id — catches every check run from
      #       this run, including any future sibling jobs in the caller.
      #   (b) name contains "dependabot-auto-merge" — catches check runs from
      #       earlier (possibly failed) invocations of this reusable workflow on the
      #       same SHA, so a stale failed run doesn't permanently block the merge.
      # If any remaining check run is still queued/in_progress, defer — a later
      # workflow_run firing will retry. If any has a non-pass conclusion, exit
      # cleanly without merging. Treats success / skipped / neutral as pass.
      - name: Gate on all check runs for HEAD SHA
        id: gate
        if: steps.pr.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ inputs.head-sha }}
          SELF_RUN_ID: ${{ github.run_id }}
        run: |
          set -u
          self_marker="/actions/runs/${SELF_RUN_ID}/"
          merge_ok=true
          processed=0
          while IFS=$'\t' read -r status conclusion details_url name; do
            [[ "$details_url" == *"$self_marker"* ]] && continue
            [[ "$name" == *"dependabot-auto-merge"* ]] && continue
            processed=$((processed + 1))
            if [[ "$status" != "completed" ]]; then
              echo "::notice::check run '${name}' is ${status}; deferring merge"
              merge_ok=false
              break
            fi
            case "$conclusion" in
              success|skipped|neutral) ;;
              *)
                echo "::notice::check run '${name}' conclusion=${conclusion}; not merging"
                merge_ok=false
                break
                ;;
            esac
          done < <(
            gh api "repos/${REPO}/commits/${HEAD_SHA}/check-runs" --paginate \
              --jq '.check_runs[] | [.status, (.conclusion // ""), .details_url, .name] | @tsv'
          )
          # Refuse to merge on an empty check-run set — workflow_run fired, so a
          # CI check run must exist on the SHA. An empty result indicates a
          # transient API gap; better to defer than merge unvalidated.
          if [[ "$processed" -eq 0 ]]; then
            echo "::notice::no non-self check runs found on HEAD SHA; deferring"
            merge_ok=false
          fi
          echo "merge_ok=${merge_ok}" >> "$GITHUB_OUTPUT"

      # Re-approves on every firing so repos with "dismiss stale approvals on new
      # commits" stay approved across Dependabot rebases.
      - name: Approve PR
        if: steps.gate.outputs.merge_ok == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr-number }}
        run: gh pr review --approve --repo "$REPO" "$PR_NUMBER"

      - name: Merge PR
        if: steps.gate.outputs.merge_ok == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr-number }}
          MERGE_METHOD: ${{ inputs.merge-method }}
        run: gh pr merge --repo "$REPO" "--$MERGE_METHOD" "$PR_NUMBER"
