##
# Example workflow for consumer repos: AI PR diff review via Cloudflare AI Gateway.
#
# Copy to .github/workflows/ (e.g. ai-code-review.yml), then:
#   - Pin `uses: ...@<full-40-char-commit-sha>` (supply chain / zizmor); bump when workflows changes.
#   - Add repository (or org) secrets: CLOUDFLARE_ACCOUNT_ID, CLOUDFLARE_AI_GATEWAY_TOKEN.
#   - Set org or repo variable CLOUDFLARE_AI_GATEWAY_ID (gateway id segment; not a secret).
#
# Forked pull_request workflows do not receive secrets; the reusable workflow is skipped
# when `head.repo.fork` is true (see caller `if` below). Same-repo PRs only.
#
# This workflow is skipped in the newfold-labs/workflows repo (no PRs to review here).
##
name: AI Code Review (example)

on:
  pull_request:
    types: [ opened, synchronize, reopened, ready_for_review ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: true

permissions: {}

jobs:
  review:
    if: github.repository != 'newfold-labs/workflows' && github.event.pull_request.draft == false && github.event.pull_request.head.repo.fork == false
    name: Review PR diff
    uses: newfold-labs/workflows/.github/workflows/reusable-code-review.yml@a2860e6a32934e332b6e1e7aebfb82340dfab353
    permissions:
      contents: read
      pull-requests: write
    secrets:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_AI_GATEWAY_TOKEN: ${{ secrets.CLOUDFLARE_AI_GATEWAY_TOKEN }}
