##
# Reusable workflow: AI pull request diff review via Cloudflare AI Gateway.
#
# Consumer repos:
#   uses: newfold-labs/workflows/.github/workflows/reusable-code-review.yml@<full-commit-sha>
#   secrets:
#     CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
#     CLOUDFLARE_AI_GATEWAY_TOKEN: ${{ secrets.CLOUDFLARE_AI_GATEWAY_TOKEN }}
#
# Required repository/org secrets:
#   - CLOUDFLARE_ACCOUNT_ID
#   - CLOUDFLARE_AI_GATEWAY_TOKEN
#
# Gateway id (URL segment): set org or repo variable CLOUDFLARE_AI_GATEWAY_ID, or pass
# workflow input cloudflare_ai_gateway_id from the caller. Variable is preferred so all
# repos share one gateway name without pinning it in YAML.
#
# Caller must grant at least pull-requests: write and checks: write so github-script can
# post PR review comments and file annotations without 403.
##
name: Reusable AI Code Review

on:
  workflow_call:
    inputs:
      ai_review_model:
        description: Model id routed through the AI Gateway (e.g. openai/gpt-5)
        type: string
        required: false
        default: openai/gpt-5
      cloudflare_ai_gateway_id:
        description: Optional override for gateway id; if empty, uses vars.CLOUDFLARE_AI_GATEWAY_ID
        type: string
        required: false
        default: ''
    secrets:
      CLOUDFLARE_ACCOUNT_ID:
        description: Cloudflare account id for AI Gateway URL
        required: true
      CLOUDFLARE_AI_GATEWAY_TOKEN:
        description: Bearer token for cf-aig-authorization
        required: true

permissions: {}

jobs:
  review:
    name: Review PR diff
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      - name: Review changed code with Cloudflare AI Gateway
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_AI_GATEWAY_ID: ${{ inputs.cloudflare_ai_gateway_id || vars.CLOUDFLARE_AI_GATEWAY_ID }}
          CLOUDFLARE_AI_GATEWAY_TOKEN: ${{ secrets.CLOUDFLARE_AI_GATEWAY_TOKEN }}
          AI_REVIEW_MODEL: ${{ inputs.ai_review_model }}
        with:
          script: |
            const accountId = process.env.CLOUDFLARE_ACCOUNT_ID;
            const gatewayId = process.env.CLOUDFLARE_AI_GATEWAY_ID;
            const gatewayToken = process.env.CLOUDFLARE_AI_GATEWAY_TOKEN;
            const model = process.env.AI_REVIEW_MODEL || 'openai/gpt-5';

            if (!accountId) {
              core.setFailed('Missing required secret: CLOUDFLARE_ACCOUNT_ID');
              return;
            }

            if (!gatewayId || !gatewayToken) {
              core.setFailed('Missing gateway id or token. Set org/repo variable CLOUDFLARE_AI_GATEWAY_ID (or pass workflow input cloudflare_ai_gateway_id) and secret CLOUDFLARE_AI_GATEWAY_TOKEN.');
              return;
            }

            const { owner, repo } = context.repo;
            const pull_number = context.payload.pull_request.number;

            const diffResponse = await github.request('GET /repos/{owner}/{repo}/pulls/{pull_number}', {
              owner,
              repo,
              pull_number,
              headers: {
                accept: 'application/vnd.github.v3.diff',
              },
            });

            const diff = String(diffResponse.data || '').slice(0, 120000);

            if (!diff.trim()) {
              core.info('No diff found to review.');
              return;
            }

            const prompt = [
              'Review this pull request diff.',
              'Return only valid JSON matching this exact shape:',
              '{"annotations":[{"path":"relative/file/path","line":123,"severity":"notice|warning|failure","title":"short title","message":"specific review comment"}]}',
              'Rules:',
              '- Only annotate changed lines that appear in the diff.',
              '- Prefer high-signal correctness, security, reliability, and test coverage issues.',
              '- Do not comment on style unless it can cause confusion or defects.',
              '- Use at most 20 annotations.',
              '- If there are no useful findings, return {"annotations":[]}.',
              '',
              diff,
            ].join('\n');

            const headers = {
              'content-type': 'application/json',
            };

            if (gatewayToken) {
              headers['cf-aig-authorization'] = `Bearer ${gatewayToken}`;
            }

            const gatewayUrl = `https://gateway.ai.cloudflare.com/v1/${accountId}/${gatewayId}/compat/chat/completions`;

            let response;
            try {
              response = await fetch(gatewayUrl, {
                method: 'POST',
                headers,
                body: JSON.stringify({
                  model,
                  messages: [
                    {
                      role: 'system',
                      content: 'You are a careful senior engineer reviewing a GitHub pull request. You produce concise inline review annotations as JSON only.',
                    },
                    {
                      role: 'user',
                      content: prompt,
                    },
                  ],
                }),
              });
            } catch (error) {
              core.warning(`AI Gateway request failed: ${error.message}`);
              return;
            }

            const responseText = await response.text();

            if (!response.ok) {
              const transient =
                response.status >= 500 ||
                response.status === 429 ||
                response.status === 408;
              if (transient) {
                core.warning(`AI Gateway request failed with ${response.status}: ${responseText}`);
                return;
              }
              core.setFailed(`AI Gateway request failed with ${response.status}: ${responseText}`);
              return;
            }

            let content;
            try {
              const completion = JSON.parse(responseText);
              content = completion.choices?.[0]?.message?.content || '';
            } catch (error) {
              core.setFailed(`Could not parse AI Gateway response JSON: ${error.message}`);
              return;
            }

            let review;
            try {
              review = JSON.parse(content.replace(/^```json\s*/i, '').replace(/^```\s*/i, '').replace(/\s*```$/i, ''));
            } catch (error) {
              core.setFailed(`Model did not return valid review JSON: ${error.message}\n${content}`);
              return;
            }

            const annotations = Array.isArray(review.annotations) ? review.annotations.slice(0, 20) : [];

            if (annotations.length === 0) {
              core.info('AI review completed with no annotations.');
              return;
            }

            const escapeCommandValue = (value) =>
              String(value ?? '')
                .replace(/%/g, '%25')
                .replace(/\r/g, '%0D')
                .replace(/\n/g, '%0A');

            const escapeCommandProperty = (value) =>
              escapeCommandValue(value)
                .replace(/:/g, '%3A')
                .replace(/,/g, '%2C');

            const commandBySeverity = {
              notice: 'notice',
              warning: 'warning',
              failure: 'error',
            };

            for (const annotation of annotations) {
              const path = escapeCommandProperty(String(annotation.path || '').trim());
              const line = Number.parseInt(annotation.line, 10);
              const command = commandBySeverity[annotation.severity] || 'warning';
              const title = escapeCommandProperty(annotation.title || 'AI code review');
              const message = escapeCommandValue(annotation.message || '');

              if (!path || !Number.isInteger(line) || line < 1 || !message) {
                core.warning(`Skipping malformed annotation: ${JSON.stringify(annotation)}`);
                continue;
              }

              console.log(`::${command} file=${path},line=${line},title=${title}::${message}`);
            }
