##
# Reusable workflow: AI pull request review via Cloudflare AI Gateway (PR comment, Claude-style).
#
# Prompts live in this repo (edit .github/ai-code-review/pr-review-prompt.md — no YAML edits needed).
#
# Consumer repos:
#   uses: newfold-labs/workflows/.github/workflows/reusable-code-review.yml@<full-commit-sha>
#   secrets:
#     CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
#     CLOUDFLARE_AI_GATEWAY_TOKEN: ${{ secrets.CLOUDFLARE_AI_GATEWAY_TOKEN }}
#
# Required repository/org secrets:
#   - CLOUDFLARE_ACCOUNT_ID
#   - CLOUDFLARE_AI_GATEWAY_TOKEN
#
# Gateway id (URL segment): set org or repo variable CLOUDFLARE_AI_GATEWAY_ID, or pass
# workflow input cloudflare_ai_gateway_id from the caller.
#
# Posts one sticky PR comment (updated on each run), similar to anthropics/claude-code-action + use_sticky_comment.
##
name: Reusable AI Code Review

on:
  workflow_call:
    inputs:
      ai_review_model:
        description: Model id routed through the AI Gateway (e.g. openai/gpt-5)
        type: string
        required: false
        default: openai/gpt-5
      cloudflare_ai_gateway_id:
        description: Optional override for gateway id; if empty, uses vars.CLOUDFLARE_AI_GATEWAY_ID
        type: string
        required: false
        default: ''
      guidance_file:
        description: Optional repo-relative path to load as review guidance (e.g. CLAUDE.md); skipped if missing
        type: string
        required: false
        default: CLAUDE.md
      prompt_template_path:
        description: Path in the workflows repo to the markdown prompt (## System message / ## User message template)
        type: string
        required: false
        default: .github/ai-code-review/pr-review-prompt.md
    secrets:
      CLOUDFLARE_ACCOUNT_ID:
        description: Cloudflare account id for AI Gateway URL
        required: true
      CLOUDFLARE_AI_GATEWAY_TOKEN:
        description: Bearer token for cf-aig-authorization
        required: true

permissions: {}

jobs:
  review:
    name: Review PR diff
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Post AI review as PR comment (Cloudflare AI Gateway)
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_AI_GATEWAY_ID: ${{ inputs.cloudflare_ai_gateway_id || vars.CLOUDFLARE_AI_GATEWAY_ID }}
          CLOUDFLARE_AI_GATEWAY_TOKEN: ${{ secrets.CLOUDFLARE_AI_GATEWAY_TOKEN }}
          AI_REVIEW_MODEL: ${{ inputs.ai_review_model }}
          GUIDANCE_FILE: ${{ inputs.guidance_file }}
          PROMPT_TEMPLATE_PATH: ${{ inputs.prompt_template_path }}
        with:
          script: |
            const STICKY_MARKER = '<!-- ai-gateway-pr-review:v1 -->';
            const MAX_COMMENT_CHARS = 62000;

            const pr = context.payload.pull_request;
            if (!pr) {
              core.warning('Not a pull_request event; skipping AI review.');
              return;
            }

            const accountId = process.env.CLOUDFLARE_ACCOUNT_ID;
            const gatewayId = process.env.CLOUDFLARE_AI_GATEWAY_ID;
            const gatewayToken = process.env.CLOUDFLARE_AI_GATEWAY_TOKEN;
            const model = process.env.AI_REVIEW_MODEL || 'openai/gpt-5';
            const guidancePath = (process.env.GUIDANCE_FILE || 'CLAUDE.md').trim() || 'CLAUDE.md';
            const promptPath = (process.env.PROMPT_TEMPLATE_PATH || '.github/ai-code-review/pr-review-prompt.md')
              .replace(/^\/+/, '')
              .trim();

            if (!accountId) {
              core.setFailed('Missing required secret: CLOUDFLARE_ACCOUNT_ID');
              return;
            }

            if (!gatewayId || !gatewayToken) {
              core.setFailed('Missing gateway id or token. Set org/repo variable CLOUDFLARE_AI_GATEWAY_ID (or pass workflow input cloudflare_ai_gateway_id) and secret CLOUDFLARE_AI_GATEWAY_TOKEN.');
              return;
            }

            const wfOwner = context.repo.owner;
            const wfRepo = context.repo.repo;

            const prRepo = context.payload.repository;
            const baseOwner = prRepo.owner.login;
            const baseRepo = prRepo.name;
            const headOwner = pr.head.repo.owner.login;
            const headRepo = pr.head.repo.name;
            const pull_number = pr.number;

            const workflowRef = process.env.GITHUB_WORKFLOW_REF || '';
            const at = workflowRef.lastIndexOf('@');
            let promptsRef = at >= 0 ? workflowRef.slice(at + 1).trim() : '';
            if (!promptsRef) {
              promptsRef = 'main';
              core.info('GITHUB_WORKFLOW_REF had no @ref; using "main" to load prompts from ' + wfOwner + '/' + wfRepo + '.');
            }

            async function loadPromptMarkdown() {
              const decodeFile = (data) => {
                if (data && !Array.isArray(data) && data.type === 'file' && data.encoding === 'base64' && data.content) {
                  return Buffer.from(data.content, 'base64').toString('utf8');
                }
                throw new Error('Unexpected getContent payload');
              };

              const tryRefs = [promptsRef];
              if (promptsRef.startsWith('refs/heads/')) {
                tryRefs.push(promptsRef.replace(/^refs\/heads\//, ''));
              }
              if (promptsRef.startsWith('refs/tags/')) {
                tryRefs.push(promptsRef.replace(/^refs\/tags\//, ''));
              }

              for (const ref of tryRefs) {
                try {
                  const { data } = await github.rest.repos.getContent({
                    owner: wfOwner,
                    repo: wfRepo,
                    path: promptPath,
                    ref,
                  });
                  return decodeFile(data);
                } catch (e) {
                  core.info('repos.getContent prompt ref=' + ref + ': ' + (e.message || e));
                }
              }

              let refRaw = promptsRef;
              if (refRaw.startsWith('refs/heads/')) refRaw = refRaw.slice('refs/heads/'.length);
              if (refRaw.startsWith('refs/tags/')) refRaw = refRaw.slice('refs/tags/'.length);
              const encodedPath = promptPath
                .split('/')
                .map((segment) => encodeURIComponent(segment))
                .join('/');
              const rawUrl =
                'https://raw.githubusercontent.com/' +
                wfOwner +
                '/' +
                wfRepo +
                '/' +
                encodeURIComponent(refRaw) +
                '/' +
                encodedPath;
              core.info('Trying raw.githubusercontent.com: ' + rawUrl);
              const r = await fetch(rawUrl);
              if (!r.ok) {
                const t = await r.text();
                throw new Error('raw fetch ' + r.status + ': ' + t.slice(0, 300));
              }
              return await r.text();
            }

            let fullMd = '';
            try {
              fullMd = await loadPromptMarkdown();
            } catch (e) {
              core.setFailed(
                'Could not load prompt markdown from ' + wfOwner + '/' + wfRepo + ' path ' + promptPath + ' (ref ' + promptsRef + '): ' + e.message,
              );
              return;
            }

            const uSplit = fullMd.split(/^##\s*User message template\s*$/m);
            if (uSplit.length < 2) {
              core.setFailed('Prompt file must contain a heading "## User message template" (see ' + promptPath + ').');
              return;
            }
            const beforeUser = uSplit[0];
            const userTemplate = uSplit.slice(1).join('').trim();
            const sSplit = beforeUser.split(/^##\s*System message\s*$/m);
            const systemFromFile = sSplit.length >= 2 ? sSplit.slice(1).join('').trim() : '';
            const systemFinal =
              systemFromFile ||
              'You are a careful senior staff engineer doing pull request reviews. You write clear, structured Markdown for GitHub. You respond with JSON only: an object with exactly one string property "body" containing the full Markdown comment text. No prose outside JSON. When prior human PR reviews appear in the user message, compare them to the current diff where the user template asks.';

            let guidanceText = '';
            try {
              const ref = pr.head.sha;
              const { data } = await github.rest.repos.getContent({
                owner: headOwner,
                repo: headRepo,
                path: guidancePath,
                ref,
              });
              if (data && !Array.isArray(data) && data.type === 'file' && data.encoding === 'base64' && data.content) {
                guidanceText = Buffer.from(data.content, 'base64').toString('utf8').slice(0, 32000);
              }
            } catch (e) {
              core.info('No guidance file at ' + guidancePath + ' on ' + headOwner + '/' + headRepo + '@' + pr.head.sha + ' (' + (e.message || e) + '). Continuing without.');
            }

            const diffResponse = await github.request('GET /repos/{owner}/{repo}/pulls/{pull_number}', {
              owner: baseOwner,
              repo: baseRepo,
              pull_number,
              headers: {
                accept: 'application/vnd.github.v3.diff',
              },
            });

            const diff = String(diffResponse.data || '').slice(0, 120000);

            if (!diff.trim()) {
              core.info('No diff found to review.');
              return;
            }

            const prTitle = pr.title || '';
            const prBody = (pr.body || '').slice(0, 8000);

            const guidanceBlock = guidanceText
              ? 'Use the following repository guidance when judging style and conventions (do not quote it verbatim unless needed):\n\n' +
                guidanceText +
                '\n\n'
              : '';

            let existingHumanReviews = '_No prior submitted human PR reviews with bodies on this pull request._';
            try {
              const allReviews = await github.paginate(github.rest.pulls.listReviews, {
                owner: baseOwner,
                repo: baseRepo,
                pull_number,
                per_page: 30,
              });
              const humanWithBody = allReviews.filter(
                (r) =>
                  r &&
                  r.body &&
                  String(r.body).trim() &&
                  r.user &&
                  r.user.type !== 'Bot' &&
                  r.state !== 'PENDING',
              );
              humanWithBody.sort((a, b) => String(b.submitted_at || '').localeCompare(String(a.submitted_at || '')));
              const parts = [];
              let used = 0;
              const maxTotal = 10000;
              for (const r of humanWithBody) {
                const login = r.user.login || 'unknown';
                const state = r.state || '';
                const shaShort = (r.commit_id || '').slice(0, 7);
                const bodySlice = String(r.body).trim().slice(0, 2500);
                const chunk =
                  '#### Review by @' +
                  login +
                  ' (' +
                  state +
                  (shaShort ? '; commit ' + shaShort : '') +
                  ')\n\n' +
                  bodySlice +
                  '\n\n';
                if (used + chunk.length > maxTotal) {
                  break;
                }
                parts.push(chunk);
                used += chunk.length;
              }
              if (parts.length > 0) {
                existingHumanReviews =
                  'Submitted **human** PR reviews (newest first; bodies truncated per review). Compare against the **current** unified diff below.\n\n' +
                  parts.join('---\n\n');
              }
            } catch (e) {
              core.info('listReviews failed: ' + (e.message || e));
              existingHumanReviews = '_Prior reviews could not be loaded from the API._';
            }

            const replacements = {
              '{{REPOSITORY}}': baseOwner + '/' + baseRepo,
              '{{PR_TITLE}}': prTitle,
              '{{PR_BODY}}': prBody,
              '{{GUIDANCE_BLOCK}}': guidanceBlock,
              '{{EXISTING_HUMAN_REVIEWS}}': existingHumanReviews,
              '{{DIFF}}': diff,
            };

            let userPrompt = userTemplate;
            for (const [token, value] of Object.entries(replacements)) {
              userPrompt = userPrompt.split(token).join(value);
            }

            const headers = {
              'content-type': 'application/json',
            };
            if (gatewayToken) {
              headers['cf-aig-authorization'] = 'Bearer ' + gatewayToken;
            }

            const gatewayUrl = 'https://gateway.ai.cloudflare.com/v1/' + accountId + '/' + gatewayId + '/compat/chat/completions';

            let response;
            try {
              response = await fetch(gatewayUrl, {
                method: 'POST',
                headers,
                body: JSON.stringify({
                  model,
                  messages: [
                    {
                      role: 'system',
                      content: systemFinal,
                    },
                    {
                      role: 'user',
                      content: userPrompt,
                    },
                  ],
                }),
              });
            } catch (error) {
              core.warning('AI Gateway request failed: ' + error.message);
              return;
            }

            const responseText = await response.text();

            if (!response.ok) {
              const transient =
                response.status >= 500 || response.status === 429 || response.status === 408;
              if (transient) {
                core.warning('AI Gateway request failed with ' + response.status + ': ' + responseText.slice(0, 2000));
                return;
              }
              core.setFailed('AI Gateway request failed with ' + response.status + ': ' + responseText.slice(0, 2000));
              return;
            }

            let rawModelText = '';
            try {
              const completion = JSON.parse(responseText);
              rawModelText = completion.choices?.[0]?.message?.content || '';
            } catch (error) {
              core.setFailed('Could not parse AI Gateway envelope JSON: ' + error.message);
              return;
            }

            const stripFences = (s) =>
              String(s || '')
                .replace(/^\s*```(?:json)?\s*/i, '')
                .replace(/\s*```\s*$/i, '')
                .trim();

            let bodyMarkdown = '';
            const stripped = stripFences(rawModelText);
            try {
              const parsed = JSON.parse(stripped);
              if (parsed && typeof parsed.body === 'string' && parsed.body.trim()) {
                bodyMarkdown = parsed.body.trim();
              }
            } catch (e) {
              core.info('Model output was not valid JSON with a body field; using raw text if usable.');
            }

            if (!bodyMarkdown) {
              if (stripped.length > 80 && /(^|\n)#+\s/.test(stripped)) {
                bodyMarkdown = stripped;
              } else {
                core.warning('Model did not return usable review content. First 500 chars: ' + stripped.slice(0, 500));
                return;
              }
            }

            if (bodyMarkdown.length > MAX_COMMENT_CHARS) {
              bodyMarkdown =
                bodyMarkdown.slice(0, MAX_COMMENT_CHARS - 200) +
                '\n\n_(Comment truncated for GitHub length limits.)_';
            }

            const commentBody = STICKY_MARKER + '\n\n## AI code review\n\n' + bodyMarkdown;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: baseOwner,
              repo: baseRepo,
              issue_number: pull_number,
              per_page: 100,
            });

            const existing = comments.find((c) => c.user && c.body && c.body.includes(STICKY_MARKER));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: baseOwner,
                repo: baseRepo,
                comment_id: existing.id,
                body: commentBody,
              });
              core.info('Updated existing sticky AI review comment ' + existing.id + '.');
            } else {
              await github.rest.issues.createComment({
                owner: baseOwner,
                repo: baseRepo,
                issue_number: pull_number,
                body: commentBody,
              });
              core.info('Created new sticky AI review comment on PR #' + pull_number + '.');
            }
