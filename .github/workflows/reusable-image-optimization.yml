name: Reusable Image Optimization

on:
  workflow_call:
    inputs:
      trigger-event:
        description: 'The event that triggered the workflow'
        required: true
        type: string

# Disable permissions for all available scopes by default.
# Any needed permissions should be configured at the job level.
permissions: {}

jobs:
  optimize-images:
    name: Optimize Images
    runs-on: ubuntu-latest
    permissions:
      contents: write      # Required so calibreapp/image-actions can commit optimized images back to the pull request head branch, and so peter-evans/create-pull-request can push a new image-optimization branch on push events.
      pull-requests: write # Required so calibreapp/image-actions can comment on the pull request with the optimization summary and so peter-evans/create-pull-request can open the optimization PR.
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Sanitize Git credentials
        run: |
          git config --local --unset-all http.https://github.com/.extraheader || true

      - name: Image Optimization
        if: inputs.trigger-event == 'pull_request'
        id: image_optimization
        env:
          GITHUB_EVENT_NAME: ${{ inputs.trigger-event }}
        uses: calibreapp/image-actions@f32575787d333b0579f0b7d506ff03be63a669d1 # v1.4.1
        with:
          GITHUB_TOKEN: ${{ github.token }}
          compressOnly: false
          jpegQuality: '82'
          pngQuality: '82'
          webpQuality: '86'

      - name: Create Pull Request
        if: inputs.trigger-event == 'push' && steps.image_optimization.outputs.markdown != ''
        uses: peter-evans/create-pull-request@c0f553fe549906ede9cf27b5156039d195d2ece0 # v8.1.0
        with:
          token: ${{ github.token }}
          commit-message: 'Optimize images'
          title: 'Optimize images'
          body: |
            This PR contains optimized images with the following quality settings:
            - JPEG: 82% quality
            - PNG: 82% quality
            - WebP: 86% quality

            These settings follow WordPress Core standards for optimal balance between file size and visual quality.

            ${{ steps.image_optimization.outputs.markdown }}
          branch: image-optimization-${{ github.sha }}
          delete-branch: true
